<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privé - OTP Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Mencken Std';
            src: url('mencken-std.otf') format('opentype');
            font-weight: 400;
        }
    </style>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-page">
        <img src="logo.svg" alt="Privé" class="auth-logo-img">
        <p class="auth-tagline">A network of extraordinary minds.</p>
        <p class="auth-subtagline">Built on trust. Driven by impact.</p>

        <div class="auth-card">
            <h1 class="auth-card-title">OTP Verification</h1>
            <p class="auth-card-subtitle" id="otpSubtitle">We have sent OTP to your registered phone number</p>

            <form id="otpForm" novalidate>
                <div class="auth-form-group">
                    <label>Enter OTP</label>
                    <div class="otp-row">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
                    </div>
                    <p class="auth-error-text" id="otpError">Incorrect OTP. Please try again.</p>
                    <div class="otp-timer">
                        <span id="timerText">Time Remaining: 00:30</span>
                        <button type="button" class="otp-resend" id="resendBtn" style="display:none;">Resend OTP</button>
                    </div>
                </div>

                <button type="submit" class="auth-btn-primary">
                    Verify
                    <i class="material-icons" style="font-size: 18px;">arrow_forward</i>
                </button>
            </form>
        </div>

        <p class="auth-footnote">
            <img src="icons/certified.svg" alt="" width="18" height="18">
            Your number is safe with us. We'll never share it with anyone.
        </p>
    </div>

    <script src="auth.js"></script>
    <script>
        redirectIfAuthenticated();

        const pendingMobile = sessionStorage.getItem('privePendingMobile');
        const masked = pendingMobile
            ? pendingMobile.slice(0, -8) + pendingMobile.slice(-8, -4).replace(/\d/g, '*') + pendingMobile.slice(-4)
            : '98******10';
        document.getElementById('otpSubtitle').textContent = 'We have sent OTP to your registered phone number ' + masked;

        const otpBoxes = Array.from(document.querySelectorAll('.otp-box'));
        const otpError = document.getElementById('otpError');

        otpBoxes.forEach((box, index) => {
            // 'input' fires reliably on both desktop and mobile virtual keyboards
            // (mobile keydown often reports e.key as "Unidentified", so digit
            // detection can't live in keydown alone).
            box.addEventListener('input', () => {
                box.value = box.value.replace(/\D/g, '').slice(-1);
                box.classList.remove('error');
                otpError.classList.remove('visible');
                if (box.value && index < otpBoxes.length - 1) {
                    otpBoxes[index + 1].focus();
                }
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (!box.value && index > 0) {
                        e.preventDefault();
                        otpBoxes[index - 1].value = '';
                        otpBoxes[index - 1].focus();
                    }
                    return;
                }

                if (e.key === 'ArrowLeft' && index > 0) {
                    e.preventDefault();
                    otpBoxes[index - 1].focus();
                    return;
                }

                if (e.key === 'ArrowRight' && index < otpBoxes.length - 1) {
                    e.preventDefault();
                    otpBoxes[index + 1].focus();
                    return;
                }
            });

            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, otpBoxes.length);
                digits.split('').forEach((digit, i) => {
                    if (otpBoxes[i]) otpBoxes[i].value = digit;
                });
                const next = otpBoxes[Math.min(digits.length, otpBoxes.length - 1)];
                if (next) next.focus();
            });
        });

        otpBoxes[0].focus();

        // ---------- Countdown timer ----------
        const timerText = document.getElementById('timerText');
        const resendBtn = document.getElementById('resendBtn');
        let secondsRemaining = 30;
        let timerInterval = null;

        function tick() {
            secondsRemaining--;
            if (secondsRemaining <= 0) {
                clearInterval(timerInterval);
                timerText.style.display = 'none';
                resendBtn.style.display = 'inline-block';
                showToast('OTP expired. Please resend to get a new code.');
                return;
            }
            const mm = String(Math.floor(secondsRemaining / 60)).padStart(2, '0');
            const ss = String(secondsRemaining % 60).padStart(2, '0');
            timerText.textContent = 'Time Remaining: ' + mm + ':' + ss;
        }

        function startTimer() {
            secondsRemaining = 30;
            timerText.style.display = 'inline';
            timerText.textContent = 'Time Remaining: 00:30';
            resendBtn.style.display = 'none';
            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
        }

        startTimer();

        resendBtn.addEventListener('click', () => {
            otpBoxes.forEach(box => {
                box.value = '';
                box.classList.remove('error');
            });
            otpError.classList.remove('visible');
            otpBoxes[0].focus();
            startTimer();
            showToast('OTP resent successfully.', 'success');
        });

        // ---------- Verify (STATIC_OTP comes from auth.js) ----------
        document.getElementById('otpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const entered = otpBoxes.map(box => box.value).join('');
            if (entered.length < 6) {
                otpBoxes.forEach(box => { if (!box.value) box.classList.add('error'); });
                otpError.textContent = 'Please enter all 6 digits.';
                otpError.classList.add('visible');
                showToast('Please enter all 6 digits.');
                return;
            }
            if (entered !== STATIC_OTP) {
                otpBoxes.forEach(box => box.classList.add('error'));
                otpError.textContent = 'Incorrect OTP. Please try again.';
                otpError.classList.add('visible');
                showToast('Incorrect OTP. Please try again.');
                return;
            }
            setAuthenticated();
            showToast('Verified successfully.', 'success');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
